            --whistle-color: #00e676;

        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.5s ease; }
        
        .header-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 25px; }

            text-align: center;

            align-items: center;
